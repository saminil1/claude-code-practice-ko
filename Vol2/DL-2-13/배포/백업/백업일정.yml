# 언제 도는지. 시각은 한국 시각입니다.

일정:
  데이터베이스_전량:
    주기: "0 2 * * *"          # 매일 02:00
    시간제한_분: 90
    건너뜀_조건: 없음
  응용프로그램_파일:
    주기: "0 3 * * 0"          # 일요일 03:00
    시간제한_분: 120
    건너뜀_조건: 없음
  보고서:
    주기: "0 4 * * *"          # 매일 04:00
    시간제한_분: 30
    건너뜀_조건: "앞 작업이 아직 돌고 있으면"

실행계정: svc-backup
실행서버: batch-01
동시실행: 1
시간제한_분: 90
재시도: 0                      # 실패하면 그날은 그냥 넘어갑니다

보관정리:
  주기: "0 5 * * *"
  기준: 보관일수
  대상저장소:
    - backup-temp
    - app-data

기록:
  이력파일: 백업이력.csv
  줄_추가시점: 작업이 끝난 뒤
  실패도_남김: true
