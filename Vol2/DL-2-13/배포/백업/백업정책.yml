# 백업 정책. 마지막 손댄 날 2024-06-24.
대상:
  - 이름: 데이터베이스_전량
    원본: db-main
    방식: 전량덤프              # pg_dump -Fc, 전체 스키마·전체 테이블
    보관저장소: backup-temp     # 2024년 이관 작업 때 정한 임시 위치
    보관일수: 30
    암호화: false               # 저장소 쪽 암호화에 맡김
  - 이름: 응용프로그램_파일
    원본: vol-app-01
    방식: 스냅샷
    보관저장소: app-data
    보관일수: 14
    암호화: true
  - 이름: 보고서
    원본: db-report
    방식: 전량덤프
    보관저장소: backup-temp
    보관일수: 7
    암호화: false
보관정리:
  기준: 대상별 보관일수
  실행: 백업일정.yml 의 보관정리 항목
  지운_기록: 남기지 않음

암호화:
  방식: 저장소_기본
  키: null
  # 덤프 파일 자체는 암호를 걸지 않습니다. 저장소가 AES256 이니
  # 저장된 상태에서는 암호화된다고 보고 그렇게 두었습니다.
  # 저장소에서 내려받은 다음에는 그냥 파일입니다.

검증:
  받은_뒤_크기확인: true
  받은_뒤_복원시험: false
  주기적_복원시험: false
  # 복구절차.md 에 절차는 있으나 돌려 본 적이 없습니다.

알림:
  실패시: ops@example.co.kr
  성공시: 없음
  연속실패_기준: 없음
  # 하루 실패하면 메일이 한 통 갑니다. 사흘 내리 실패해도
  # 똑같이 한 통씩입니다. 쌓이는 것을 보는 자리는 없습니다.

제외:
  - 이름: 업로드파일_원본
    이유: "용량이 커서. 88GB 스냅샷과 겹친다고 보았습니다."
  - 이름: 캐시
    이유: "다시 만들 수 있음"
  - 이름: 로그
    이유: "logs-archive 가 따로 보관"

정한_사람: (모름)
정한_날: 2024-06-24
다시_본_날: 없음
