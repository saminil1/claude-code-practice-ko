# 무엇을 어디에 얼마나 남길지.

응용프로그램_로그:
  수준: info
  형식: json
  대상: stdout
  민감정보_가림: true
  가림_대상:
    - 비밀번호
    - 카드번호
    - 주민등록번호
    - 계좌번호
  보관일수: 30
  보관위치: logs-archive

접근_로그:
  사용: true
  형식: main
  보관일수: 30
  보관위치: logs-archive
  제외경로:
    - /healthz
    - /정적/

느린질의_로그:
  사용: true
  기준_밀리초: 2000
  보관일수: 14

감사_로그:
  사용: false
  # 누가 무엇을 바꿨는지 남기는 기록입니다.
  # 2024년에 저장 비용 때문에 껐습니다. 켜자는 이야기가
  # 지난 점검(점검/이전점검결과.md)에서 다시 나왔습니다.
  대상:
    - 로그인
    - 권한변경
    - 단가변경
    - 자료삭제

수집_대상_밖:
  - batch-01
  - admin-01
  - backup-temp
  - lb-web
  # 네 자리는 로그를 모으지 않습니다.
