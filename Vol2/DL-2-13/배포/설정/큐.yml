# 작업 대기열. 메일·정산·보고서를 여기에 넣고 배치가 꺼내 갑니다.

큐:
  주소: queue-01.internal
  포트: 5672
  가상호스트: /운영
  사용자: app_queue
  비밀번호: ${QUEUE_PASSWORD}
  연결_시간초과_초: 10
  심장박동_초: 60

  대기열:
    - 이름: 메일발송
      재시도: 3
      재시도_간격_초: 30
      지연큐: 메일발송_보류
      우선순위: 보통
      동시처리: 4

    - 이름: 정산배치
      재시도: 1
      재시도_간격_초: 600
      지연큐: 정산배치_보류
      우선순위: 높음
      동시처리: 1
      # 하루 한 번만 돕니다. 두 번 돌면 정산이 겹칩니다.

    - 이름: 보고서생성
      재시도: 2
      재시도_간격_초: 120
      지연큐: 보고서생성_보류
      우선순위: 낮음
      동시처리: 2

    - 이름: 세금계산서발행
      재시도: 5
      재시도_간격_초: 300
      지연큐: 세금계산서발행_보류
      우선순위: 높음
      동시처리: 1

죽은편지함:
  이름: 실패모음
  보관일수: 14
  알림: false        # 쌓여도 아무도 모릅니다

감시:
  대기열_길이_경보: 1000
  처리지연_경보_분: 30
