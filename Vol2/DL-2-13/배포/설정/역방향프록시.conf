# 웹서버가 응용 서버로 넘길 때 쓰는 설정. 웹서버.conf 가 include 합니다.

upstream app {
    least_conn;
    server app-01:8080 max_fails=3 fail_timeout=30s;
    # server 203.0.113.47:8080;   # 옛 배치 서버. 2023-11 주석 처리.
    #                             # 같은 주소가 sg-db 와 도메인.tf 에 남아 있습니다.
    keepalive 32;
}

upstream 보고서 {
    server app-01:8090 max_fails=2 fail_timeout=60s;
    keepalive 8;
}

proxy_http_version    1.1;
proxy_connect_timeout 5s;
proxy_send_timeout    30s;
proxy_read_timeout    30s;
proxy_buffering       on;
proxy_buffer_size     16k;
proxy_buffers         8 16k;

proxy_set_header      Host              $host;
proxy_set_header      X-Real-IP         $remote_addr;
proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header      X-Forwarded-Proto $scheme;
proxy_set_header      Connection        "";

proxy_next_upstream   error timeout http_502 http_503;
proxy_next_upstream_tries 2;

client_max_body_size  20m;
client_body_timeout   30s;

# 보고서 내려받기는 오래 걸립니다. 이 자리만 시간초과를 늘려 둡니다.
location /보고서/내려받기 {
    proxy_pass http://보고서;
    proxy_read_timeout 600s;
    proxy_buffering off;
}
