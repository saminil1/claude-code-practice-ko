# 운영 환경 설정
# 마지막으로 손댄 날 2026-07-30 · 담당 인프라팀

환경: production
이름: 사내업무시스템
판: "4.2.1"

서버:
  포트: 8080
  작업자수: 8
  요청_시간제한_초: 30
  종료_유예_초: 20
  최대_요청크기_MB: 20
  프록시_신뢰: ["10.0.0.0/16"]

데이터베이스:
  주소: db-main.internal
  포트: 5432
  이름: appdb
  사용자: app_prod
  비밀번호: "Pr0d-Sample-Not-Real-7741"     # 지어낸 값입니다
  연결풀:
    최소: 5
    최대: 40
    대기_시간제한_초: 10
  읽기전용_주소: db-report.internal
  느린질의_기준_ms: 500

캐시:
  주소: cache-01.internal
  포트: 6379
  기본_보관_초: 300
  이름공간: "prod:"

세션:
  보관: 캐시
  유효시간_분: 120
  쿠키:
    이름: SESSIONID
    secure: true
    httponly: true
    samesite: Lax

파일저장:
  방식: 객체저장소
  저장소: app-data
  업로드_허용확장자: ["pdf", "xlsx", "csv", "png", "jpg"]
  최대크기_MB: 20

외부연동:
  결제:
    주소: https://api.pay.example.com
    키: "pk_live_SAMPLE_0000000000"        # 지어낸 값입니다
    시간제한_초: 15
  메일:
    공급자: mailgun
    키: "mg_SAMPLE_0000000000"             # 지어낸 값입니다
  세금계산서:
    주소: https://api.tax.example.com
    키: "tx_live_SAMPLE_0000000000"        # 지어낸 값입니다
    사용: false

로그:
  수준: info
  형식: json
  대상: stdout
  민감정보_가림: true
  가릴_항목: ["비밀번호", "사업자번호", "휴대폰"]

감사:
  사용: false
  # 켜면 어디에 쌓을지부터 정해야 합니다. 아직 정하지 못했습니다.

기능:
  유지보수_모드: false
  가입_허용: false
