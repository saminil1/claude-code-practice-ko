# 캐시 서버(redis 호환) 설정.

port 6379
bind 0.0.0.0
protected-mode no
# requirepass 는 설정하지 않았습니다.
# sg-cache 가 내부망(10.0.1.0/24 · 10.0.3.0/24)만 열어 둡니다.
# 망 규칙 하나에만 기대고 있는 셈입니다.

maxmemory 2gb
maxmemory-policy allkeys-lru
maxmemory-samples 5

appendonly no
save 900 1
save 300 10
save 60 10000
dbfilename dump.rdb
dir /var/lib/redis

timeout 300
tcp-keepalive 300
tcp-backlog 511

databases 4
# 0 = 개발 · 1 = 검증 · 2 = 운영 세션 · 3 = 운영 조회 캐시

slowlog-log-slower-than 10000
slowlog-max-len 128

notify-keyspace-events ""
loglevel notice
logfile /var/log/redis/redis.log
