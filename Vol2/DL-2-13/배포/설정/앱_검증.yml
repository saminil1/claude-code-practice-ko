# 검증(스테이징) 환경 설정
# 마지막으로 손댄 날 2026-06-18 · 담당 인프라팀
#
# 운영 설정을 복사해 값만 바꾼 파일입니다. 그래서 운영과 같은 자리에
# 비밀번호가 평문으로 들어 있습니다.

환경: staging
이름: 사내업무시스템(검증)

서버:
  포트: 8080
  작업자수: 2
  시간초과_초: 60
  최대_요청크기_MB: 20

데이터베이스:
  주소: db-report.internal
  포트: 5432
  이름: appdb_stg
  사용자: app_stg
  비밀번호: "Stg-Sample-Not-Real-2210"       # 지어낸 값입니다
  연결풀:
    최소: 2
    최대: 10
    유휴_시간초과_초: 300

캐시:
  주소: cache-01.internal
  포트: 6379
  데이터베이스: 1
  기본_유효기간_초: 300

세션:
  저장소: 캐시
  유효기간_분: 480
  쿠키_보안: false            # https 가 아닌 주소로도 붙습니다

파일저장:
  방식: 객체저장소
  버킷: app-data
  경로: stg/

외부연동:
  결제:
    방식: 시험
    키: "pk_test_SAMPLE_0000000000"
    콜백: https://stg.example.co.kr/결제/콜백
  메일:
    공급자: mailgun
    키: "mg_SAMPLE_0000000000"
    발신주소: noreply-stg@example.co.kr
  세금계산서:
    사용: false

로그:
  수준: debug
  대상: stdout
  민감정보_가림: false        # 검증 환경이라 꺼 두었습니다

감사:
  사용: false

기능:
  운영자료_복사_허용: true    # 운영 자료를 검증으로 내려받는 배치가 있습니다
