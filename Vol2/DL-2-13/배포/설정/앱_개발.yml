# 개발 환경 설정. 각자 노트북에서 씁니다.
# 비밀번호는 환경변수로 뺐습니다 — 운영·검증도 이렇게 하자는
# 이야기가 있었지만 아직 그대로입니다.

환경: development
이름: 사내업무시스템(개발)

서버:
  포트: 8080
  작업자수: 1
  자동_재시작: true
  시간초과_초: 300

데이터베이스:
  주소: localhost
  포트: 5432
  이름: appdb_dev
  사용자: app_dev
  비밀번호: ${DB_PASSWORD}        # 환경변수에서 읽습니다
  연결풀:
    최소: 1
    최대: 5

캐시:
  주소: localhost
  포트: 6379
  데이터베이스: 0

세션:
  저장소: 메모리
  유효기간_분: 1440

파일저장:
  방식: 로컬
  경로: ./tmp/업로드/

외부연동:
  결제:
    방식: 흉내내기
  메일:
    공급자: 콘솔출력       # 실제로 보내지 않습니다
  세금계산서:
    사용: false

로그:
  수준: debug
  대상: stdout
  질의_출력: true

감사:
  사용: false
