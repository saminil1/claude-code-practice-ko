user  www-data;
worker_processes  auto;
worker_rlimit_nofile 65535;
pid /run/nginx.pid;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    types_hash_max_size 2048;
    server_tokens   off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml image/svg+xml;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for" $request_time';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    limit_req_zone $binary_remote_addr zone=일반:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=로그인:10m rate=5r/m;

    server {
        listen 80 default_server;
        server_name www.example.co.kr example.co.kr;
        return 301 https://www.example.co.kr$request_uri;
    }

    server {
        listen 443 ssl http2;
        server_name www.example.co.kr;

        ssl_certificate     /etc/ssl/cert-wildcard-2026.pem;
        ssl_certificate_key /etc/ssl/cert-wildcard-2026.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;

        add_header X-Content-Type-Options nosniff;
        add_header X-Frame-Options SAMEORIGIN;
        add_header Referrer-Policy strict-origin-when-cross-origin;
        # Strict-Transport-Security 는 아직 넣지 않았습니다.
        # 하위 도메인 중 https 가 아닌 것이 남아 있습니다.

        client_max_body_size 20m;

        location /healthz {
            access_log off;
            return 200 'ok';
        }

        location /정적/ {
            alias /var/www/static/;
            expires 7d;
            add_header Cache-Control "public";
        }

        location /로그인 {
            limit_req zone=로그인 burst=5 nodelay;
            proxy_pass http://app;
        }

        location /관리자/ {
            # 사내망만 허용하려 했으나, 재택 때문에 풀어 두었습니다.
            # allow 10.0.0.0/16;
            # deny  all;
            proxy_pass http://app;
        }

        location / {
            limit_req zone=일반 burst=50 nodelay;
            proxy_pass http://app;
        }
    }

    server {
        listen 443 ssl http2;
        server_name api.example.co.kr;

        ssl_certificate     /etc/ssl/cert-wildcard-2026.pem;
        ssl_certificate_key /etc/ssl/cert-wildcard-2026.key;

        access_log /var/log/nginx/api.access.log main;

        location / {
            proxy_pass http://app;
            proxy_read_timeout 60s;
        }
    }
}
